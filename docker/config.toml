# Mount persistent storage at this path and make it writable by UID 10001.
projects_dir = "/var/lib/flicksy/projects"

# Database defaults to the persistent project directory.
[auth]
# Enable when the application is accessed via HTTPS.
secure_cookie = false

# Optional YouTube integration; mount both secret files read-only.
# [youtube]
# client_id = "YOUR_GOOGLE_CLIENT_ID"
# client_secret_file = "/run/secrets/youtube_client_secret"
# encryption_key_file = "/run/secrets/youtube_encryption_key"
# redirect_uri = "https://example.com/youtube/callback"

[server]
host = "0.0.0.0"
port = 3000

# Levels: off, error, warn, info, debug, trace.
[tracing]
level = "info"

[llm]
# Override this configuration for your inference endpoint and credentials.
base_url = "http://rust-arch:6284/v1"
model = "openai/gpt-6.1-terra"
# api_key_env = "FLICKSY_API_KEY"
# api_key_file = "/run/secrets/flicksy_api_key"
request_timeout_seconds = 120
