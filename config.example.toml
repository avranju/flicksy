# Relative paths are resolved relative to this configuration file.
projects_dir = "projects"

# Public contact shown on the privacy policy and terms pages.
# Replace this placeholder before sharing your installation; restart to apply.
[operator]
contact_email = "operator@example.com"

# Accounts, persistent sessions, and projects default to projects_dir/flicksy.sqlite.
# Set secure_cookie = true when serving through HTTPS.
[auth]
# database = "projects/flicksy.sqlite"
secure_cookie = false

# Optional YouTube integration. Create the key with:
# python3 -c 'import secrets; print(secrets.token_urlsafe(32))'
# Store both files securely outside the repository and backups of the database.
# [youtube]
# client_id = "YOUR_GOOGLE_CLIENT_ID"
# client_secret_file = "/run/secrets/youtube_client_secret"
# encryption_key_file = "/run/secrets/youtube_encryption_key"
# redirect_uri = "https://example.com/youtube/callback"

[server]
host = "127.0.0.1"
port = 3000

# Levels: off, error, warn, info, debug, trace.
[tracing]
level = "info"

[llm]
# Replace with your OpenAI-compatible endpoint and tool-calling model ID.
base_url = "https://llm.example.com/v1"
model = "YOUR_TOOL_CALLING_MODEL"
# Optional: set api_key_env to the name of an environment variable. It takes
# precedence over api_key_file when both are configured. Omit both for no auth.
# api_key_env = "FLICKSY_API_KEY"
# api_key_file = "/run/secrets/flicksy_api_key"
request_timeout_seconds = 120
