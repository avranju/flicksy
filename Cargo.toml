[package]
name = "flicksy"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.1"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "fs", "io-util", "sync"] }
topcoat = { version = "0.11.0", features = [
    "font-fontsource",
    "multipart",
    "tailwind",
    "ui",
] }

[build-dependencies]
topcoat = { version = "0.11.0", default-features = false, features = [
    "tailwind",
] }
