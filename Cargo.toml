[package]
name = "flicksy"
version = "0.1.0"
edition = "2024"

[dependencies]
rig = { version = "0.45", features = ["agent", "reqwest"] }
futures-util = "0.3"
http-body = "1"
http-body-util = "0.1"
tokio-util = { version = "0.7", features = ["io"] }
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.1"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "fs", "io-util", "sync", "process", "net"] }
topcoat = { version = "0.11.0", features = [
    "font-fontsource",
    "multipart",
    "tailwind",
    "ui",
] }

[build-dependencies]
topcoat = { version = "0.11.0", default-features = false, features = [
    "tailwind",
] }
